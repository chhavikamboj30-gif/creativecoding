<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get to Know Me</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
cursor:none;
}

/* MOON CURSOR */

.moon-cursor{
position:fixed;
width:26px;
height:26px;
border-radius:50%;
background:#fff6d5;
box-shadow:
0 0 8px #fff6d5,
0 0 18px #fff6d5,
0 0 35px rgba(255,246,213,0.7);

pointer-events:none;
z-index:9999;
transform:translate(-50%,-50%);
}

/* LIGHT TRAIL */
.trail{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:#fff3c4;
opacity:0.6;
pointer-events:none;
z-index:9998;
animation:trailFade 1s linear forwards;
}

@keyframes trailFade{
0%{
opacity:0.7;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(0.3);
}
}

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#e7d3c9;
color:#040404;
overflow-x:hidden;
}

/* HEADER */

.header{
text-align:center;
padding:70px 20px 40px;
}

.header h1{
font-size:48px;
margin-bottom:10px;
}

.header p{
font-size:16px;
opacity:0.8;
}

/* MONTH GRID */

.months{
width:1100px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:50px;
padding-bottom:120px;
}

/* MONTH CARD */

.month{
background:#f3ecdf;
padding:60px 40px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
transition:all .4s ease;
position:relative;
cursor:pointer;
text-decoration:none;
color:#111;
}

/* PAPER TEXTURE */

.month{
background-image:
radial-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),
radial-gradient(rgba(0,0,0,0.02) 1px,transparent 1px);
background-size:18px 18px,24px 24px;
background-position:0 0,12px 12px;
}

/* HOVER */

.month:hover{
transform:translateY(-10px) rotate(-1deg);
box-shadow:0 35px 60px rgba(0,0,0,0.25);
}

/* MONTH NAME */

.month-name{
font-family:'Playfair Display',serif;
font-size:32px;
margin-bottom:12px;
}

/* SUBTITLE */

.month-sub{
font-size:24px;
color:#444;
}

/* STAR DECOR */

.star{
position:absolute;
width:20px;
height:20px;
opacity:.6;
animation:float 5s ease-in-out infinite;
}

.star svg{
fill:#dcb360;
}

.star1{top:20px;left:20px;}
.star2{bottom:20px;right:25px;animation-delay:1s;}

/* FLOAT ANIMATION */

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

/* SCROLL FADE */

.fade{
opacity:0;
transform:translateY(40px);
transition:all .8s ease;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:1100px){

.months{
width:90%;
grid-template-columns:1fr;
gap:30px;
}

}


#constellation{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
pointer-events:none;
}

</style>

</head>

<body>
<canvas id="constellation"></canvas>

<div class="moon-cursor"></div>

<div class="header fade">
<h1>Get to Know Me</h1>

<p>Choose the one that fascinates you</p>

</div>

<section class="months">

<a href="weekly.html" class="month fade">

<div class="month-name">Journal</div>
<div class="month-sub">My year in weeks</div>

<div class="star star1">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

<div class="star star2">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

</a>

<a href="poetry.html" class="month fade">

<div class="month-name">Fragments</div>
<div class="month-sub">Words by Me</div>

<div class="star star1">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

<div class="star star2">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

</a>

<a href="creative-coding.html" class="month fade">

<div class="month-name">Creative Coding</div>
<div class="month-sub">Fun with Code</div>

<div class="star star1">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

<div class="star star2">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

</a>



<div class="star star2">
<svg viewBox="0 0 24 24">
<polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9"/>
</svg>
</div>

</a>
</section>

<script>

/* SCROLL FADE */

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show");
}
});
});

document.querySelectorAll(".fade").forEach(el=>{
observer.observe(el);
});

</script>

<script>

const canvas = document.getElementById("constellation");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
let mouse = {x:null,y:null};

/* create stars */

for(let i=0;i<220;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2
});
}

/* mouse tracking */

window.addEventListener("mousemove",function(e){
mouse.x = e.x;
mouse.y = e.y;
});

/* resize */

window.addEventListener("resize",function(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
});

/* draw stars */

function drawStars(){

ctx.clearRect(0,0,canvas.width,canvas.height);

stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.size,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();
});

/* draw constellation lines */

stars.forEach(star=>{
let dx = star.x - mouse.x;
let dy = star.y - mouse.y;
let distance = Math.sqrt(dx*dx + dy*dy);

if(distance < 220){

stars.forEach(otherStar=>{

let dx2 = star.x - otherStar.x;
let dy2 = star.y - otherStar.y;
let dist = Math.sqrt(dx2*dx2 + dy2*dy2);

if(dist < 120){

ctx.beginPath();
ctx.moveTo(star.x,star.y);
ctx.lineTo(otherStar.x,otherStar.y);
ctx.strokeStyle="rgba(255,255,255,0.35)";
ctx.lineWidth=0.7;
ctx.stroke();

}

});

}

});

requestAnimationFrame(drawStars);

}

drawStars();

</script>

<script>

const moon = document.querySelector(".moon-cursor");

document.addEventListener("mousemove", e => {

moon.style.left = e.clientX + "px";
moon.style.top = e.clientY + "px";

});

</script>
</body>
</html>
