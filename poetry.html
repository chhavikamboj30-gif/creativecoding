<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fragments</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">

<style>

/* BACKGROUND */

body{
background:#efe7dd;
font-family:'DM Sans', sans-serif;
margin:0;
}

/* NAVBAR */

.nav{
display:flex;
justify-content:center;
gap:50px;
padding:25px;
font-size:13px;
letter-spacing:2px;
}

.nav a{
text-decoration:none;
color:#333;
}

.active{
border-bottom:2px solid #d6a8a4;
padding-bottom:4px;
}

/* CONTAINER */

.container{
width:800px;
margin:40px auto;
display:flex;
flex-direction:column;
gap:40px;
}

/* CARD */

.card{
background:#f6efe7;
border-radius:18px;
box-shadow:0 20px 40px rgba(0,0,0,0.08);
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* IMAGE */

.card img{
width:100%;
height:280px;
object-fit:cover;
}

/* CONTENT */

.content{
padding:25px 30px;
}

/* TEXT */

.quote{
font-family:'Playfair Display', serif;
font-size:22px;
line-height:1.6;
margin-bottom:15px;
}

.small{
font-family:'Caveat', cursive;
font-size:18px;
color:#7a5c58;
}

/* BUTTON */

.read{
display:inline-block;
margin-top:10px;
padding:10px 22px;
background:#e6b8b5;
color:#fff;
font-size:12px;
letter-spacing:2px;
text-decoration:none;
border-radius:20px;
}

/* ICONS */

.actions{
margin-top:15px;
font-size:14px;
color:#777;
display:flex;
gap:20px;
}

/* RESPONSIVE */

@media(max-width:850px){
.container{
width:90%;
}
}

/* FULL SCREEN READER */

.reader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.4s;
z-index:999;
}

.reader.active{
opacity:1;
pointer-events:auto;
}

/* PAPER PAGE */

.reader-content{
width:700px;
max-width:90%;
background:#f6efe7;
padding:60px;
border-radius:10px;
box-shadow:0 40px 80px rgba(0,0,0,0.25);
position:relative;

/* paper texture */
background-image:
radial-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
radial-gradient(rgba(0,0,0,0.015) 1px, transparent 1px);

background-size:18px 18px, 24px 24px;
}

/* TEXT */

.reader-text{
font-family:'Playfair Display', serif;
font-size:22px;
line-height:1.9;
color:#2f2a26;
white-space:pre-line;
}

/* CLOSE BUTTON */

.close{
position:absolute;
top:15px;
right:25px;
font-size:28px;
cursor:pointer;
color:#777;
}

</style>
</head>

<body>

<!-- POSTS -->
<div class="container">

<!-- CARD 1 -->
<div class="card">
<img src="images/poem1.png">
<div class="content">
<div class="quote">
between truth and shadows—
</div>
<div class="small">
a story of fading bonds and finding self again
</div>
<a href="poem1.html" class="read">READ MORE</a>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="/images/poem2.png">
<div class="content">
<div class="quote">
the geography of hearts—
</div>
<div class="small">
distance measures miles, not meaning</div>
<a href="poem2.html" class="read">READ MORE</a>
</div>
</div>

<!-- CARD 3 -->
<div class="card">
<img src="images/poem3.png">
<div class="content">
<div class="quote">
the art of quiet waiting—
</div>
<div class="small">
hope doesn’t die—it learns how to hide</div>
<a href="poem3.html" class="read">READ MORE</a>
</div>
</div>

<!-- CARD 4 -->
<div class="card">
<img src="images/poem4.png">
<div class="content">
<div class="quote">
unsaid—
</div>
<div class="small">
the loudest things are often never spoken
</div>
<a href="poem4.html" class="read">READ MORE</a>
</div>
</div>

</div>


</body>

</html>
